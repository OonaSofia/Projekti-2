<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Levylöytö</h1>
      <p>Valitse artisti tai hae oma suosikkiartistisi</p>
      <link rel="stylesheet" href="styles.css" />
    </header>

    <main>
      <section class="controls">
        <h2>Valitse artisti</h2>
        <div id="artistList"></div>

        <div class="search-box">
          <input
            id="artistSearch"
            type="text"
            placeholder="Etsi artistia"
          />
          <button id="searchButton">Hae</button>
        </div>
      </section>

      <section>
        <h2 id="artistTitle">Albumit</h2>
        <div id="albums" class="album-grid"></div>
      </section>

      <section id="albumDetails" class="details hidden"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
